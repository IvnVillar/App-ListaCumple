name: Keep backend awake

# El plan gratuito de Render duerme el servicio tras ~15 min sin tráfico,
# haciendo que la primera petición después tarde mucho (arranque en frío).
# Un ping periódico y gratuito a /health evita ese problema sin pagar por
# un plan superior.
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping /health
        run: curl -fsS https://app-listacumple.onrender.com/health
